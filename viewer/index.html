<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPLAT! Live Coverage</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { height: 100%; }

  .splat-panel {
    background: rgba(255,255,255,0.97);
    padding: 12px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    font-size: 12px;
    width: 260px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
  }
  .splat-panel h3 { margin: 0 0 8px 0; font-size: 14px; }
  .splat-panel h4 {
    margin: 14px 0 4px 0; font-size: 10px; text-transform: uppercase;
    color: #888; letter-spacing: 0.7px; border-bottom: 1px solid #eee; padding-bottom: 3px;
  }
  .splat-panel label { display: block; margin-top: 5px; font-size: 11px; color: #444; }
  .splat-panel input, .splat-panel select {
    width: 100%; box-sizing: border-box; padding: 4px 6px;
    font-size: 12px; font-family: ui-monospace, Consolas, monospace;
    margin-top: 2px;
  }
  .splat-panel button {
    width: 100%; padding: 7px; margin-top: 8px; font-size: 12px;
    cursor: pointer; border: 1px solid #888; background: white; border-radius: 3px;
  }
  .splat-panel button.primary { background: #2c7; color: white; border-color: #2c7; font-weight: 600; }
  .splat-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
  .splat-panel button.active { background: #fc6; border-color: #c80; }
  .splat-panel .status {
    padding: 6px 8px; margin-top: 8px; font-size: 11px;
    background: #f3f3f3; border-radius: 3px; min-height: 14px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .splat-panel .status.busy { background: #ffc; }
  .splat-panel .status.ok   { background: #dfd; }
  .splat-panel .status.err  { background: #fdd; color: #a00; }
  .splat-panel .row { display: flex; gap: 6px; }
  .splat-panel .row > label { flex: 1; }

  /* Phase 17c: toast notifications -- map-corner overlay for transient
     errors / info. Stacks bottom-up so the most recent toast is on top.
     Click anywhere on a toast to dismiss; auto-dismiss after 6 s for
     info / 12 s for errors (long enough to actually read a stack trace
     before it disappears). */
  .splat-toast-stack {
    position: absolute; bottom: 18px; right: 18px; z-index: 1000;
    display: flex; flex-direction: column-reverse; gap: 8px;
    max-width: 360px; pointer-events: none;
  }
  .splat-toast {
    background: #2b2b2b; color: #fafafa; padding: 10px 12px;
    border-radius: 4px; font-size: 12px; line-height: 1.4;
    font-family: ui-monospace, Consolas, monospace;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35); cursor: pointer;
    pointer-events: auto; opacity: 0; transform: translateY(8px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    border-left: 3px solid #888;
    word-break: break-word;
  }
  .splat-toast.shown { opacity: 1; transform: translateY(0); }
  .splat-toast.info  { border-left-color: #4aa3ff; }
  .splat-toast.error { border-left-color: #ff5555; }
  .splat-toast.warn  { border-left-color: #ffb700; }
  .splat-toast .splat-toast-title { font-weight: 600; margin-bottom: 2px; }
  .splat-toast .splat-toast-hint  { font-size: 10px; opacity: 0.6; margin-top: 4px; }

  /* Progress bar -- shown only while a compute is in flight */
  .splat-progress {
    display: none;
    margin-top: 6px;
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
  }
  .splat-progress.active { display: block; }
  .splat-progress > .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #5af, #2c7);
    transition: width 0.4s ease;
  }
  /* Indeterminate animation when we don't yet have a numeric % to show */
  .splat-progress.indeterminate > .fill {
    width: 30% !important;
    animation: splat-pulse 1.4s ease-in-out infinite;
    background: linear-gradient(90deg, #9cf, #69b);
  }
  @keyframes splat-pulse {
    0%   { margin-left: -30%; }
    100% { margin-left: 100%; }
  }
  .splat-stage {
    font-size: 10px; color: #888;
    margin-top: 3px; text-align: right;
    font-family: ui-monospace, Consolas, monospace;
  }

  .splat-tx-marker {
    background: #c00; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(async () => {
  const params  = new URLSearchParams(location.search);
  const initialName = params.get('name') || 'live';

  // ---------------- Map + basemap ----------------
  const map = L.map('map').setView([40.7, -74.0], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);

  let txMarker = null;
  let overlay  = null;
  let placeMode = false;
  let txLat = null, txLon = null;

  // ---------------- Presets ----------------
  // Antenna presets: typical gain in dBi (relative to isotropic).
  const antennas = {
    'rubber-duck':      { label: 'Stock rubber duck (handheld)',  gain: -2  },
    'whip':             { label: '1/4-wave whip',                  gain:  2  },
    'fiberglass-std':   { label: 'Standard fiberglass (5/8 wave)', gain:  3  },
    'fiberglass-high':  { label: 'High-gain fiberglass omni',      gain:  6  },
    'fiberglass-xhigh': { label: 'Extended-range fiberglass omni', gain:  9  },
    'custom':           { label: 'Custom',                          gain: null }
  };

  // Band presets: default frequency MHz, typical max power W, polarization.
  const bands = {
    'frs':    { label: 'FRS (UHF 462 MHz)',       freq: 462.6,  watts:    2, pol: 'V' },
    'gmrs':   { label: 'GMRS (UHF 462/467 MHz)',  freq: 462.6,  watts:    5, pol: 'V' },
    'murs':   { label: 'MURS (VHF 151 MHz)',      freq: 151.82, watts:    2, pol: 'V' },
    '2m-ham': { label: '2 m amateur (VHF 146)',   freq: 146.5,  watts:   50, pol: 'V' },
    '70cm-ham':{ label: '70 cm amateur (UHF 432)',freq: 446.0,  watts:   50, pol: 'V' },
    'tv-uhf': { label: 'UHF TV broadcast',         freq: 605,    watts: 1000, pol: 'H' },
    'custom': { label: 'Custom',                    freq: null,   watts: null, pol: 'V' }
  };

  // ---------------- Side panel ----------------
  const panel = L.control({ position: 'topright' });
  panel.onAdd = () => {
    const div = L.DomUtil.create('div', 'splat-panel');
    const antOpts  = Object.entries(antennas).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
    const bandOpts = Object.entries(bands   ).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
    div.innerHTML = `
      <h3>📡 SPLAT! Live Coverage</h3>

      <h4>Transmitter</h4>
      <button id="place">📍 Click map to set TX</button>
      <div class="row">
        <label>Lat <input id="lat" type="number" step="0.0001" placeholder="40.8022"></label>
        <label>Lon <input id="lon" type="number" step="0.0001" placeholder="-74.2464"></label>
      </div>

      <h4>Radio</h4>
      <label>Band <select id="band">${bandOpts}</select></label>
      <label>Frequency (MHz) <input id="freq" type="number" step="0.1"></label>
      <label>Power (W) <input id="watts" type="number" step="0.1"></label>

      <h4>Antenna</h4>
      <label>Type <select id="ant">${antOpts}</select></label>
      <div class="row">
        <label>Gain (dBi) <input id="gain" type="number" step="0.1"></label>
        <label>Height AGL (m) <input id="height" type="number" step="0.5" value="10"></label>
      </div>

      <h4>Analysis</h4>
      <label>Range (mi) <input id="range" type="number" step="1" value="30"></label>
      <!-- Phase 14: Draft toggle. HD (1 arc-sec, default) runs at full
           resolution; Draft (3 arc-sec) is ~17x faster but visibly chunkier
           coverage edges. Requires the standard-resolution tile cache,
           built once via utils/downsample_hd_to_std.ps1. -->
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;">
        <input id="draft" type="checkbox">
        Draft mode (faster, lower resolution)
      </label>

      <div class="row">
        <button id="compute" class="primary" disabled style="flex:2;">Compute coverage</button>
        <button id="computeCancel" style="flex:1;display:none;">Cancel</button>
      </div>
      <div id="status" class="status">Place a transmitter to begin.</div>
      <div id="progress" class="splat-progress"><div class="fill"></div></div>
      <div id="stage" class="splat-stage"></div>
      <div id="elapsed" class="splat-stage" style="text-align:left;"></div>

      <h4>Overlay</h4>
      <label>Opacity <input id="op" type="range" min="0" max="1" step="0.05" value="0.6"></label>

      <!-- Phase 15: Terrain cache panel. Toggle drops one colored rectangle
           per cached integer-degree tile onto the map so the user sees at a
           glance which clicks will be fast vs trigger an auto-fetch. -->
      <h4>Terrain cache</h4>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;">
        <input id="showCache" type="checkbox">
        Show cached tiles on map
      </label>
      <div id="cacheStats" class="status" style="margin-top:6px;font-size:11px;line-height:1.45;">
        <span style="opacity:0.7;">Loading cache status&hellip;</span>
      </div>
      <div style="display:flex;gap:8px;font-size:11px;color:#aaa;margin-top:4px;">
        <span style="display:inline-flex;align-items:center;gap:4px;">
          <span style="width:10px;height:10px;background:#2ecc71;display:inline-block;border-radius:2px;opacity:0.55;"></span> HD + Draft
        </span>
        <span style="display:inline-flex;align-items:center;gap:4px;">
          <span style="width:10px;height:10px;background:#f1c40f;display:inline-block;border-radius:2px;opacity:0.55;"></span> Draft only
        </span>
        <span style="display:inline-flex;align-items:center;gap:4px;">
          <span style="width:10px;height:10px;background:#3498db;display:inline-block;border-radius:2px;opacity:0.55;"></span> HD only
        </span>
      </div>

      <!-- Phase 18: previously-computed scenarios. Lists the cached PNGs
           Phase 10 saves (key, TX coords, band/power, draft flag). Click
           Load to restore the form state + place the TX; the next Compute
           click will hit the cache so the round-trip is ~0.1 s. -->
      <h4>Computed scenarios</h4>
      <div id="compCacheHeader" class="status" style="font-size:11px;line-height:1.4;">
        <span style="opacity:0.7;">Loading&hellip;</span>
      </div>
      <div id="compCacheList" style="font-size:11px;max-height:160px;overflow-y:auto;border:1px solid #333;border-radius:3px;margin-top:4px;display:none;"></div>
      <div class="row" style="margin-top:4px;">
        <button id="compCacheRefresh" style="flex:1;font-size:11px;">Refresh</button>
        <button id="compCacheClearAll" style="flex:1;font-size:11px;">Clear all</button>
      </div>

      <!-- Phase 16b: in-UI precache trigger. Lets the user kick off the same
           work that utils\precache_srtm.ps1 + downsample_hd_to_std.ps1 do
           from the CLI, without leaving the viewer. Each tile-completion
           event from the server bumps a per-tile rectangle in the overlay
           so the user can watch coverage fill in live. -->
      <div style="margin-top:10px;padding-top:8px;border-top:1px solid #333;">
        <div style="font-size:11px;color:#aaa;margin-bottom:4px;">Build cache for region</div>
        <div class="row" style="gap:4px;">
          <select id="precacheRegion" style="flex:2;">
            <option value="NE">Northeast US (140 tiles, ~6 GB)</option>
            <option value="MidAtl">Mid-Atlantic (54 tiles, ~2 GB)</option>
            <option value="CONUS">CONUS (~1450 tiles, ~60 GB)</option>
            <option value="view">Current map view</option>
          </select>
          <select id="precacheMode" style="flex:1;">
            <option value="both">HD + Draft</option>
            <option value="hd">HD only</option>
            <option value="std">Draft only</option>
          </select>
        </div>
        <div class="row" style="margin-top:4px;">
          <button id="precacheBtn"       style="flex:2;font-size:12px;">Start precache</button>
          <button id="precacheCancelBtn" style="flex:1;font-size:12px;display:none;">Cancel</button>
        </div>
        <div id="precacheStatus" class="status" style="margin-top:4px;font-size:11px;line-height:1.4;display:none;"></div>
        <div id="precacheProgress" class="splat-progress" style="margin-top:4px;display:none;"><div class="fill"></div></div>
      </div>
    `;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  };
  panel.addTo(map);

  // ---------------- DOM refs ----------------
  const $       = id => document.getElementById(id);
  const placeBtn= $('place');
  const latInp  = $('lat');
  const lonInp  = $('lon');
  const bandSel = $('band');
  const freqInp = $('freq');
  const wattsInp= $('watts');
  const antSel  = $('ant');
  const gainInp = $('gain');
  const heightInp = $('height');
  const rangeInp= $('range');
  const compBtn = $('compute');
  const statusEl= $('status');
  const opSlider= $('op');
  const showCacheCb = $('showCache');
  const cacheStatsEl = $('cacheStats');

  // Initialise presets
  bandSel.value = 'gmrs';
  antSel.value  = 'fiberglass-high';
  freqInp.value = bands.gmrs.freq;
  wattsInp.value= bands.gmrs.watts;
  gainInp.value = antennas['fiberglass-high'].gain;

  bandSel.addEventListener('change', () => {
    const p = bands[bandSel.value];
    if (p.freq  !== null) freqInp.value  = p.freq;
    if (p.watts !== null) wattsInp.value = p.watts;
    saveSettings();
  });
  antSel.addEventListener('change', () => {
    const p = antennas[antSel.value];
    if (p.gain !== null) gainInp.value = p.gain;
    saveSettings();
  });

  // ---------------- Settings persistence (Phase 17a) ----------------
  // Persist form state across page reloads / launcher restarts via
  // localStorage. The intent is "remember what I was doing last time" --
  // band, antenna, power, range, draft toggle, overlay opacity, etc.
  // Map state (zoom / center) and which TX is placed are intentionally NOT
  // persisted; placing a TX is the user's explicit "start here" action.
  const SETTINGS_KEY = 'easyprop.settings.v1';
  const PERSISTED = [
    ['band','value'], ['freq','value'], ['watts','value'],
    ['ant','value'],  ['gain','value'], ['height','value'],
    ['range','value'], ['draft','checked'],
    ['op','value'],   ['showCache','checked'],
    ['precacheRegion','value'], ['precacheMode','value'],
  ];
  function saveSettings() {
    const out = {};
    for (const [id, prop] of PERSISTED) {
      const el = document.getElementById(id);
      if (el != null) out[id] = el[prop];
    }
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(out)); }
    catch (e) { /* private mode or quota full -- silently swallow */ }
  }
  function restoreSettings() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }
    catch (e) { return; }
    if (!saved) return;
    for (const [id, prop] of PERSISTED) {
      const el = document.getElementById(id);
      if (el != null && saved[id] !== undefined) el[prop] = saved[id];
    }
  }
  restoreSettings();
  // Save on any change to any persisted control. Single delegated listener
  // keeps it tidy; the band/antenna `change` handlers above also call
  // saveSettings() so the cascaded freq/watts/gain updates get captured.
  for (const [id, _] of PERSISTED) {
    const el = document.getElementById(id);
    if (el == null) continue;
    const ev = (el.type === 'checkbox' || el.tagName === 'SELECT') ? 'change' : 'input';
    el.addEventListener(ev, saveSettings);
  }

  function setStatus(msg, cls='') {
    statusEl.textContent = msg;
    statusEl.className   = 'status ' + cls;
  }

  // ---------------- Toast notifications (Phase 17c) ----------------
  // Replaces the older "raw exception text in the status box" pattern for
  // anything the user might actually need to react to (SRTM mirror down,
  // cache directory not writable, splat-hd not found). The status line
  // still shows transient working state; toasts are for things you want
  // to see after the status has moved on.
  const toastStack = document.createElement('div');
  toastStack.className = 'splat-toast-stack';
  map.getContainer().parentElement.appendChild(toastStack);

  function toast(message, opts = {}) {
    const { title = null, kind = 'info', durationMs = null, hint = null } = opts;
    const t = document.createElement('div');
    t.className = 'splat-toast ' + (kind || 'info');
    if (title) {
      const h = document.createElement('div');
      h.className = 'splat-toast-title'; h.textContent = title;
      t.appendChild(h);
    }
    t.appendChild(document.createTextNode(message));
    if (hint) {
      const sub = document.createElement('div');
      sub.className = 'splat-toast-hint'; sub.textContent = hint;
      t.appendChild(sub);
    }
    toastStack.appendChild(t);
    // Trigger fade-in next frame
    requestAnimationFrame(() => t.classList.add('shown'));
    const dismiss = () => {
      t.classList.remove('shown');
      setTimeout(() => t.remove(), 250);
    };
    t.addEventListener('click', dismiss);
    const ms = durationMs ?? (kind === 'error' ? 12000 : 6000);
    setTimeout(dismiss, ms);
    return dismiss;
  }
  // Bind to window so other modules / one-liners can call it.
  window.toast = toast;

  // ---------------- TX placement ----------------
  function setTx(lat, lon) {
    txLat = lat; txLon = lon;
    latInp.value = lat.toFixed(4);
    lonInp.value = lon.toFixed(4);
    if (txMarker) { txMarker.setLatLng([lat, lon]); }
    else {
      const icon = L.divIcon({className: 'splat-tx-marker', iconSize: [14, 14]});
      txMarker = L.marker([lat, lon], {icon: icon, draggable: true}).addTo(map);
      txMarker.on('dragend', e => {
        const ll = e.target.getLatLng();
        setTx(ll.lat, ll.lng);
      });
    }
    compBtn.disabled = false;
    if (statusEl.textContent.startsWith('Place')) {
      setStatus(`TX at (${lat.toFixed(4)}, ${lon.toFixed(4)}). Click "Compute coverage".`);
    }
  }
  function setPlaceMode(on) {
    placeMode = on;
    placeBtn.classList.toggle('active', on);
    placeBtn.textContent = on ? '✕ Cancel placement' : '📍 Click map to set TX';
    map.getContainer().style.cursor = on ? 'crosshair' : '';
  }
  placeBtn.addEventListener('click', () => setPlaceMode(!placeMode));
  map.on('click', e => {
    if (placeMode) {
      setTx(e.latlng.lat, e.latlng.lng);
      setPlaceMode(false);
    }
  });
  function maybeUpdateFromInputs() {
    if (latInp.value !== '' && lonInp.value !== '') {
      setTx(+latInp.value, +lonInp.value);
    }
  }
  latInp.addEventListener('change', maybeUpdateFromInputs);
  lonInp.addEventListener('change', maybeUpdateFromInputs);

  // ---------------- Terrain cache overlay (Phase 15) ----------------
  // Lazy-fetched + cached for the session. Each cached tile is rendered as
  // a 1-degree Leaflet rectangle colored by what's on disk:
  //   green = both HD and Draft tiles present (click is fast in either mode)
  //   yellow = Draft only (HD click would auto-fetch)
  //   blue = HD only (Draft click would sea-level-fill)
  // Anywhere on the map WITHOUT a colored rectangle has nothing cached at
  // all, so the first click in that area will trigger an SRTM fetch (HD)
  // or sea-level fill (Draft).
  const cacheLayer = L.layerGroup();
  let cacheLoadPromise = null;
  function fetchCacheReport() {
    if (!cacheLoadPromise) {
      cacheLoadPromise = fetch('/cache')
        .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`))
        .catch(e => { cacheLoadPromise = null; throw e; });
    }
    return cacheLoadPromise;
  }
  function renderCacheStats(report) {
    const t = report.totals;
    const gb = mb => mb >= 1024 ? (mb/1024).toFixed(2) + ' GB' : mb.toFixed(0) + ' MB';
    cacheStatsEl.innerHTML =
      `${t.tile_count} tile${t.tile_count === 1 ? '' : 's'} cached ` +
      `&middot; HD ${t.hd_count} (${gb(t.hd_mb)}) ` +
      `&middot; Draft ${t.std_count} (${gb(t.std_mb)})`;
  }
  function tileColor(tile) {
    if (tile.hd && tile.std) return '#2ecc71';   // green
    if (tile.std)            return '#f1c40f';   // yellow
    if (tile.hd)             return '#3498db';   // blue
    return null;                                  // not drawn
  }
  function populateCacheLayer(report) {
    cacheLayer.clearLayers();
    for (const tile of report.tiles) {
      const color = tileColor(tile);
      if (!color) continue;
      // Tile N<lat>W<west> covers latitudes [lat, lat+1] and east-longitudes
      // [-west, -(west-1)] (since `west` here is the splat positive-west
      // convention). Leaflet wants [[south, west_east], [north, east_east]].
      const bounds = [[tile.lat, -tile.west], [tile.lat + 1, -(tile.west - 1)]];
      const rect = L.rectangle(bounds, {
        color: color, weight: 0.5, opacity: 0.6,
        fillColor: color, fillOpacity: 0.18,
        interactive: true
      });
      const hdMb  = (tile.hd_bytes  / (1024*1024)).toFixed(1);
      const stdMb = (tile.std_bytes / (1024*1024)).toFixed(1);
      const tileName = `N${String(tile.lat).padStart(2,'0')}W${String(tile.west).padStart(3,'0')}`;
      rect.bindTooltip(
        `<b>${tileName}</b><br>` +
        `HD: ${tile.hd ? hdMb + ' MB' : '—'}<br>` +
        `Draft: ${tile.std ? stdMb + ' MB' : '—'}`,
        { sticky: true });
      rect.addTo(cacheLayer);
    }
  }
  showCacheCb.addEventListener('change', async () => {
    if (showCacheCb.checked) {
      cacheStatsEl.textContent = 'Loading…';
      try {
        const report = await fetchCacheReport();
        renderCacheStats(report);
        populateCacheLayer(report);
        cacheLayer.addTo(map);
      } catch (e) {
        cacheStatsEl.textContent = 'Failed: ' + e;
        showCacheCb.checked = false;
      }
    } else {
      map.removeLayer(cacheLayer);
    }
  });
  // Always load the headline stats once on page load (cheap, ~140 file stats).
  // The user can then opt into the visual overlay without waiting for fetch.
  fetchCacheReport()
    .then(renderCacheStats)
    .catch(e => { cacheStatsEl.textContent = 'Cache status unavailable: ' + e; });

  // ---------------- Compute-cache management (Phase 18) ----------------
  // Lists cache entries the Phase-10 deterministic compute cache wrote (one
  // .png + .geo + .json triplet per request). The .json sidecar holds the
  // original request, so "Load" can deterministically restore exactly what
  // would have been re-computed.
  const compCacheHeader   = document.getElementById('compCacheHeader');
  const compCacheList     = document.getElementById('compCacheList');
  const compCacheRefresh  = document.getElementById('compCacheRefresh');
  const compCacheClearAll = document.getElementById('compCacheClearAll');

  function fmtCacheTs(iso) {
    // ISO with timezone -> "5/29 18:42"
    const d = new Date(iso);
    if (isNaN(d)) return iso || '';
    const mm = d.getMonth() + 1, dd = d.getDate();
    const HH = String(d.getHours()).padStart(2, '0');
    const MM = String(d.getMinutes()).padStart(2, '0');
    return `${mm}/${dd} ${HH}:${MM}`;
  }
  function renderCompCacheList(report) {
    compCacheHeader.innerHTML =
      `${report.count} scenario${report.count === 1 ? '' : 's'} cached, ` +
      `${report.total_mb} MB on disk`;
    compCacheList.innerHTML = '';
    if (report.count === 0) {
      compCacheList.style.display = 'none';
      return;
    }
    compCacheList.style.display = 'block';
    for (const e of report.entries) {
      const r = e.request || {};
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #2a2a2a;';
      const label = document.createElement('div');
      label.style.cssText = 'flex:1;line-height:1.35;';
      const draftBadge = r.draft ? ' <span style="background:#f1c40f;color:#000;padding:0 4px;border-radius:2px;font-size:10px;">DFT</span>' : '';
      label.innerHTML =
        `<div>${fmtCacheTs(e.cached_at)} &middot; ${r.lat?.toFixed(3)}, ${r.lon?.toFixed(3)}${draftBadge}</div>` +
        `<div style="color:#999;font-size:10px;">${r.freq_mhz} MHz &middot; ${r.watts} W &middot; ${r.gain_dbi} dBi &middot; ${r.antenna_height_m} m &middot; ${r.range_mi} mi &middot; ${e.png_mb} MB</div>`;
      const loadBtn = document.createElement('button');
      loadBtn.textContent = 'Load';
      loadBtn.style.cssText = 'font-size:10px;padding:2px 6px;';
      loadBtn.addEventListener('click', () => loadCachedScenario(e));
      const delBtn  = document.createElement('button');
      delBtn.textContent = '×';
      delBtn.title = 'Delete this cached scenario';
      delBtn.style.cssText = 'font-size:12px;padding:2px 8px;color:#c44;';
      delBtn.addEventListener('click', () => deleteCachedScenario(e.key));
      row.appendChild(label);
      row.appendChild(loadBtn);
      row.appendChild(delBtn);
      compCacheList.appendChild(row);
    }
  }
  function loadCachedScenario(entry) {
    const r = entry.request || {};
    // Restore form fields
    if (r.freq_mhz       !== undefined) freqInp.value   = r.freq_mhz;
    if (r.watts          !== undefined) wattsInp.value  = r.watts;
    if (r.gain_dbi       !== undefined) gainInp.value   = r.gain_dbi;
    if (r.antenna_height_m !== undefined) heightInp.value = r.antenna_height_m;
    if (r.range_mi       !== undefined) rangeInp.value  = r.range_mi;
    if (r.draft          !== undefined) document.getElementById('draft').checked = r.draft;
    saveSettings();
    // Place the TX (also pans the map appropriately via existing setTx logic)
    if (r.lat !== undefined && r.lon !== undefined) {
      setTx(r.lat, r.lon);
      map.setView([r.lat, r.lon], Math.max(map.getZoom(), 9));
    }
    toast('Settings restored. Click "Compute coverage" to fetch from cache.', {
      kind: 'info', title: 'Scenario loaded'
    });
  }
  async function deleteCachedScenario(key) {
    try {
      const r = await fetch('/cache/compute/' + encodeURIComponent(key), { method: 'DELETE' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const out = await r.json();
      toast(`Removed ${out.removed} file${out.removed === 1 ? '' : 's'}.`,
            { kind: 'info', title: 'Deleted', durationMs: 3000 });
      refreshCompCache();
    } catch (e) {
      toast(e.message, { kind: 'error', title: 'Delete failed' });
    }
  }
  async function refreshCompCache() {
    try {
      const r = await fetch('/cache/compute');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rep = await r.json();
      renderCompCacheList(rep);
    } catch (e) {
      compCacheHeader.textContent = 'Compute cache unavailable: ' + e.message;
    }
  }
  compCacheRefresh.addEventListener('click', refreshCompCache);
  compCacheClearAll.addEventListener('click', async () => {
    if (!confirm('Wipe ALL cached compute scenarios?\n\nThis deletes every cached PNG/geo/sidecar from %LOCALAPPDATA%\\EasyProp\\cache\\. Settings tiles (terrain) are not touched.')) return;
    try {
      const r = await fetch('/cache/compute', { method: 'DELETE' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const out = await r.json();
      toast(`Cleared. ${out.removed} files deleted.`, { kind: 'info', title: 'Cache cleared' });
      refreshCompCache();
    } catch (e) {
      toast(e.message, { kind: 'error', title: 'Clear failed' });
    }
  });
  // Initial load
  refreshCompCache();

  // ---- Precache trigger (Phase 16b) ----
  // Streams NDJSON from /cache/precache the same way /compute does. As each
  // fetch_progress / downsample_progress event arrives we patch the in-memory
  // tile state and re-draw just that tile's rectangle, so coverage fills in
  // live without re-issuing a /cache GET for every tile.
  const precacheBtn    = document.getElementById('precacheBtn');
  const precacheRegion = document.getElementById('precacheRegion');
  const precacheMode   = document.getElementById('precacheMode');
  const precacheStatus = document.getElementById('precacheStatus');
  const precacheProg   = document.getElementById('precacheProgress');
  const precacheFill   = precacheProg.querySelector('.fill');

  // Mirror of /cache report so we can update individual tiles without a refetch.
  // Populated lazily by fetchCacheReport(); precache events upsert into it.
  let cacheState = null;
  function ensureCacheStateLoaded() {
    if (cacheState) return Promise.resolve(cacheState);
    return fetchCacheReport().then(r => { cacheState = r; return r; });
  }
  function upsertTile(lat, west, opts) {
    if (!cacheState) return;
    const key = lat + ',' + west;
    let t = cacheState.tiles.find(x => x.lat === lat && x.west === west);
    if (!t) {
      t = { lat, west, hd:false, std:false, hd_bytes:0, std_bytes:0 };
      cacheState.tiles.push(t);
    }
    if (opts.hd  !== undefined) t.hd  = opts.hd;
    if (opts.std !== undefined) t.std = opts.std;
    // Re-render just this tile in the overlay if it's visible.
    if (map.hasLayer(cacheLayer)) {
      // Find and remove any existing rectangle for this tile, then add fresh.
      cacheLayer.eachLayer(L => {
        const b = L.getBounds();
        const s = b.getSouth(), w = -b.getEast();   // recover (lat, west)
        if (Math.round(s) === lat && Math.round(w) === west) cacheLayer.removeLayer(L);
      });
      const color = tileColor(t);
      if (color) {
        const bounds = [[lat, -west], [lat + 1, -(west - 1)]];
        L.rectangle(bounds, {
          color, weight:0.5, opacity:0.6, fillColor:color, fillOpacity:0.18, interactive:true
        }).addTo(cacheLayer);
      }
    }
  }
  function buildPrecacheBody() {
    const region = precacheRegion.value;
    const mode   = precacheMode.value;
    if (region === 'view') {
      // Current map view -> integer-tile bounds covering it. Round outward
      // so the user's whole visible area is covered (one tile of buffer is
      // implicit because Math.floor / Math.ceil of an integer is itself).
      const b = map.getBounds();
      const minLat  = Math.floor(b.getSouth());
      const maxLat  = Math.ceil(b.getNorth()) - 1;   // inclusive of the SW corner
      // splat west convention is positive-west: lon -75 -> west=75
      const minWest = Math.floor(-b.getEast()) + 1;
      const maxWest = Math.ceil(-b.getWest());
      if (maxLat < minLat || maxWest < minWest) {
        return { error: 'Map view is too narrow; zoom out or pan to a real area.' };
      }
      return { mode, minLat, maxLat, minWest, maxWest };
    }
    return { mode, region };
  }
  // Phase 17b: cancel = client AbortController + server detect-disconnect.
  // While the fetch is in flight we expose precacheCancelBtn; clicking it
  // calls controller.abort(), which closes the response stream. The
  // server's next OutputStream.Write throws -> cancel token flips ->
  // Invoke-PrecacheStreaming exits cleanly with a `cancelled` event.
  // (The browser doesn't actually see that event because the stream is
  // already torn down, but the server logs it and any partially-cached
  // tiles do stay cached.)
  let precacheAbort = null;
  const precacheCancelBtn = document.getElementById('precacheCancelBtn');
  precacheCancelBtn.addEventListener('click', () => {
    if (precacheAbort) precacheAbort.abort();
  });
  precacheBtn.addEventListener('click', async () => {
    const body = buildPrecacheBody();
    if (body.error) {
      precacheStatus.style.display = 'block';
      precacheStatus.textContent = body.error;
      return;
    }
    await ensureCacheStateLoaded();
    precacheBtn.disabled = true;
    precacheCancelBtn.style.display = '';
    precacheStatus.style.display = 'block';
    precacheProg.style.display = 'block';
    precacheFill.style.width = '0%';
    precacheStatus.textContent = 'Starting…';
    const t0 = performance.now();
    let fetchDone = 0, fetchTotal = 0, dsDone = 0, dsTotal = 0;
    precacheAbort = new AbortController();
    try {
      const r = await fetch('/cache/precache', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: precacheAbort.signal
      });
      if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const dec    = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          const ev = JSON.parse(line);
          // Patch the overlay and update the progress text.
          if (ev.stage === 'setup') {
            precacheStatus.textContent = ev.message;
          } else if (ev.stage === 'fetch_start') {
            fetchTotal = ev.tiles_to_fetch || 0;
            precacheStatus.textContent = `HD fetch: 0 / ${fetchTotal} (${ev.tiles_cached} already cached)`;
          } else if (ev.stage === 'fetch_progress') {
            fetchDone = ev.tiles_done;
            if (ev.status === 'ok') {
              // Parse tile name "N40W074" -> (lat, west)
              const m = /^N(\d+)W(\d+)$/.exec(ev.tile);
              if (m) upsertTile(+m[1], +m[2], { hd:true });
            }
            const pct = fetchTotal ? (fetchDone / fetchTotal) * 50 : 0;
            precacheFill.style.width = pct.toFixed(1) + '%';
            precacheStatus.textContent = `HD fetch: ${fetchDone} / ${fetchTotal} (${ev.tile} ${ev.status})`;
          } else if (ev.stage === 'fetch_done') {
            precacheStatus.textContent = `HD done: ${ev.tiles_fetched} fetched, ${ev.tiles_skipped} skip, ${ev.tiles_failed} fail`;
          } else if (ev.stage === 'downsample_start') {
            dsTotal = ev.tiles_to_make;
            precacheStatus.textContent = `Draft downsample: 0 / ${dsTotal}`;
          } else if (ev.stage === 'downsample_progress') {
            dsDone = ev.tiles_done;
            if (ev.status === 'ok') {
              const m = /^N(\d+)W(\d+)$/.exec(ev.tile);
              if (m) upsertTile(+m[1], +m[2], { std:true });
            }
            const pct = 50 + (dsTotal ? (dsDone / dsTotal) * 50 : 50);
            precacheFill.style.width = pct.toFixed(1) + '%';
            precacheStatus.textContent = `Draft: ${dsDone} / ${dsTotal} (${ev.tile} ${ev.status})`;
          } else if (ev.stage === 'downsample_done') {
            // pass
          } else if (ev.stage === 'done') {
            const sec = ((performance.now() - t0) / 1000).toFixed(0);
            precacheFill.style.width = '100%';
            precacheStatus.textContent =
              `Done in ${sec}s · HD +${ev.hd_ok} (${ev.hd_skipped} skip, ${ev.hd_failed} fail) · Draft +${ev.std_ok}`;
            // Refresh the headline stats display from server truth.
            cacheLoadPromise = null;
            fetchCacheReport().then(rep => { cacheState = rep; renderCacheStats(rep); });
          } else if (ev.stage === 'error') {
            throw new Error(ev.error);
          }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        precacheStatus.textContent = 'Precache cancelled. Tiles already finished stay cached.';
        toast('Precache cancelled.', { title: 'Cancelled', kind: 'warn' });
        // Refresh cache state -- some tiles likely landed before cancel.
        cacheLoadPromise = null;
        fetchCacheReport().then(rep => { cacheState = rep; renderCacheStats(rep); });
      } else {
        precacheStatus.textContent = 'Precache failed';
        toast(e.message, { title: 'Precache failed', kind: 'error',
                            hint: 'Some tiles may have been cached before the failure.' });
      }
    } finally {
      precacheBtn.disabled = false;
      precacheCancelBtn.style.display = 'none';
      precacheAbort = null;
      setTimeout(() => { precacheProg.style.display = 'none'; }, 2000);
    }
  });

  // ---------------- Compute ----------------
  async function loadOverlay(pngUrl, geoUrl) {
    const txt = await (await fetch(geoUrl)).text();
    const tps = txt.split('\n').filter(l => l.startsWith('TIEPOINT')).map(l => {
      const f = l.split(/\s+/);
      return { lon: +f[3], lat: +f[4] };
    });
    if (tps.length < 2) throw new Error('bad .geo (no TIEPOINT lines)');
    const lats = tps.map(p => p.lat), lons = tps.map(p => p.lon);
    const bounds = [
      [Math.min(...lats), Math.min(...lons)],
      [Math.max(...lats), Math.max(...lons)]
    ];
    if (overlay) map.removeLayer(overlay);
    overlay = L.imageOverlay(pngUrl, bounds, {
      opacity: +opSlider.value, interactive: false
    }).addTo(map);
    return bounds;
  }

  // --- Progress bar plumbing ---
  const progressEl = $('progress');
  const fillEl     = progressEl.querySelector('.fill');
  const stageEl    = $('stage');
  const elapsedEl  = $('elapsed');
  let elapsedTimer = null;

  function showProgress(on)        { progressEl.classList.toggle('active', on); }
  function setProgressIndet(on)    { progressEl.classList.toggle('indeterminate', on); }
  function setProgressPercent(pct) { fillEl.style.width = Math.max(0, Math.min(100, pct)) + '%'; }
  function setStage(text)          { stageEl.textContent = text || ''; }

  function startElapsedTimer(t0) {
    stopElapsedTimer();
    elapsedTimer = setInterval(() => {
      const s = (performance.now() - t0) / 1000;
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      elapsedEl.textContent = `elapsed ${m}:${r.toString().padStart(2,'0')}`;
    }, 250);
  }
  function stopElapsedTimer() {
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
  }

  // Map a single streaming event from the server onto the progress bar +
  // status line. Total work is split 0-30% fetch, 30-95% compute, 95-100%
  // PNG write. Fetch and splat sub-progress fill their bands smoothly.
  function applyEvent(ev) {
    switch (ev.stage) {
      case 'setup':
        setStage('identifying tiles');
        setProgressIndet(true);
        break;

      case 'fetch_start':
        if (ev.tiles_to_fetch > 0) {
          setStage(`fetching ${ev.tiles_to_fetch} SRTM tile${ev.tiles_to_fetch>1?'s':''} (parallel)`);
          setProgressIndet(false);
          setProgressPercent(2);
          setStatus(`Fetching ${ev.tiles_to_fetch} SRTM tile${ev.tiles_to_fetch>1?'s':''}… (${ev.tiles_cached} cached)`, 'busy');
        } else {
          setStage('all SRTM tiles cached');
          setProgressPercent(30);
          setStatus('All SRTM tiles cached, starting compute…', 'busy');
        }
        break;

      case 'fetch_progress':
        // 0-30% of overall: scale tile count.
        if (ev.tiles_total > 0) {
          setProgressPercent(2 + 28 * ev.tiles_done / ev.tiles_total);
          setStage(`fetched ${ev.tiles_done}/${ev.tiles_total}: ${ev.tile} (${ev.status})`);
        }
        break;

      case 'fetch_done':
        setProgressPercent(30);
        setStage(`fetch complete (${ev.tiles_fetched} ok, ${ev.tiles_skipped} ocean, ${ev.tiles_failed} failed)`);
        break;

      case 'splat_start':
        setStatus('Running ITWOM propagation… (~60-120s)', 'busy');
        setStage('splat: running');
        // We can't get fine-grained splat progress in real time -- .NET's
        // pipe redirector buffers splat's stdout until the process exits.
        // Until we either rebuild splat with fflush or use a direct stdout
        // reader, pulse the bar through this phase so the user sees "still
        // working" instead of a stuck 30%.
        setProgressIndet(true);
        break;

      case 'splat_progress':
        // We only get a couple of these in practice (start and end of the
        // run, due to the buffering). Use them just to switch back to a
        // determinate bar when we hit the "writing_png" / done phases that
        // do fire near the end.
        if (ev.phase === 'writing_png' || ev.percent >= 90) {
          setProgressIndet(false);
          setProgressPercent(30 + ev.percent * 0.65);
          setStage(`splat: ${ev.phase} ${ev.percent}%`);
        } else if (ev.percent > 0) {
          setProgressIndet(false);
          setProgressPercent(30 + ev.percent * 0.65);
          setStage(`splat: ${ev.phase} ${ev.percent}%`);
        } else {
          setStage(`splat: ${ev.phase}`);
        }
        break;

      case 'done':
        setProgressPercent(100);
        setStage(`done in ${ev.elapsed_sec.toFixed(1)}s splat + ${ev.fetch_sec.toFixed(1)}s fetch`);
        return { kind: 'done', event: ev };

      case 'error':
        setProgressIndet(false);
        return { kind: 'error', event: ev };
    }
    return null;
  }

  // Phase 17b: compute cancel mirrors the precache pattern. AbortController
  // tears down the response stream; the server detects via OutputStream
  // failure and kills the splat-hd child process.
  let computeAbort = null;
  const computeCancelBtn = document.getElementById('computeCancel');
  computeCancelBtn.addEventListener('click', () => {
    if (computeAbort) computeAbort.abort();
  });
  compBtn.addEventListener('click', async () => {
    if (txLat === null) return;
    const req = {
      lat: txLat, lon: txLon,
      freq_mhz: +freqInp.value, watts: +wattsInp.value,
      gain_dbi: +gainInp.value,
      antenna_height_m: +heightInp.value,
      range_mi: +rangeInp.value,
      polarization: bands[bandSel.value]?.pol || 'V',
      // Phase 14: server uses this to pick splat (Draft) vs splat-hd, and
      // the std vs HD SDF cache. Field name `draft` is what Get-CacheKey
      // checks; absence is treated as false (HD).
      draft: document.getElementById('draft').checked
    };
    compBtn.disabled = true;
    computeCancelBtn.style.display = '';
    const t0 = performance.now();
    setStatus('Computing coverage…', 'busy');
    showProgress(true);
    setProgressIndet(true);
    setProgressPercent(0);
    setStage('starting');
    startElapsedTimer(t0);

    let terminal = null;
    computeAbort = new AbortController();
    try {
      const r = await fetch('/compute', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(req),
        signal: computeAbort.signal
      });
      if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);

      // Read newline-delimited JSON events as they arrive.
      const reader  = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // last item may be a partial line
        for (const line of lines) {
          if (!line.trim()) continue;
          let ev;
          try { ev = JSON.parse(line); }
          catch (parseErr) { console.warn('bad event line:', line); continue; }
          const t = applyEvent(ev);
          if (t) terminal = t;
        }
      }

      if (!terminal) throw new Error('stream ended without a done/error event');
      if (terminal.kind === 'error') throw new Error(terminal.event.error || 'unknown error');

      const ev = terminal.event;
      const ts = Date.now();
      const bounds = await loadOverlay(`live.png?t=${ts}`, `live.geo?t=${ts}`);
      map.fitBounds(bounds);

      const dtTotal = ((performance.now() - t0) / 1000).toFixed(1);
      if (ev.cached) {
        // Cache hit -- skipped fetch + splat entirely. Total wall time is
        // really just "how fast did the browser receive + decode the PNG."
        setStatus(`Done ${dtTotal}s · served from cache (${ev.cache_key})`, 'ok');
        setStage(`cache hit ${ev.cache_key}`);
      } else {
        const fetchNote = ev.tiles_fetched > 0
          ? ` · fetched ${ev.tiles_fetched} SRTM tile${ev.tiles_fetched > 1 ? 's' : ''} (${ev.fetch_sec.toFixed(1)}s)`
          : (ev.tiles_needed > 0 ? ' · all SRTM tiles cached' : '');
        setStatus(`Done ${dtTotal}s · splat ${ev.elapsed_sec.toFixed(1)}s${fetchNote} · cached as ${ev.cache_key}`, 'ok');
        // Phase 15: HD auto-fetch may have added tiles to disk. Bust the
        // session-level cache report so the next overlay toggle / stats
        // refresh sees the new tiles. Cheap; we only refresh if the panel
        // is already open.
        if (ev.tiles_fetched > 0) {
          cacheLoadPromise = null;
          if (showCacheCb.checked) {
            fetchCacheReport().then(r => { renderCacheStats(r); populateCacheLayer(r); });
          } else {
            fetchCacheReport().then(renderCacheStats);
          }
        }
        // Phase 18: a fresh compute lands one new entry in the compute cache.
        refreshCompCache();
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        setStatus('Cancelled.', 'err');
        setStage('cancelled');
        toast('Compute cancelled.', { title: 'Cancelled', kind: 'warn' });
      } else {
        setStatus('Compute failed', 'err');
        setStage('failed');
        toast(e.message, { title: 'Compute failed', kind: 'error',
                            hint: 'See server console for stack trace.' });
      }
    } finally {
      compBtn.disabled = false;
      computeCancelBtn.style.display = 'none';
      computeAbort = null;
      stopElapsedTimer();
      // Leave the progress bar visible briefly so the user sees the final 100%
      setTimeout(() => showProgress(false), 1500);
    }
  });

  opSlider.addEventListener('input', e => {
    if (overlay) overlay.setOpacity(parseFloat(e.target.value));
  });

  // ---------------- Initial overlay (if a pre-existing file is named) ----------------
  try {
    const r = await fetch(`${initialName}.geo`);
    if (r.ok) {
      const bounds = await loadOverlay(`${initialName}.png`, `${initialName}.geo`);
      map.fitBounds(bounds);
    }
  } catch { /* no initial overlay; that's fine */ }
})();
</script>
</body>
</html>
